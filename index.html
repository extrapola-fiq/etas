<body>
<style>
  :root{
    color-scheme: dark;
    --room:#141815;
    --enamel:#35423a;
    --enamel-hi:#43534a;
    --enamel-lo:#222b25;
    --brass:#b8914f;
    --brass-hi:#ecd08e;
    --brass-lo:#6e5325;
    --plate:#e6dcc3;
    --plate-ink:#24211a;
    --engrave:#cdbf9c;
    --stencil:"Big Shoulders Stencil Display", "Arial Narrow", Impact, sans-serif;
    --type:"Cutive Mono", "Courier New", Courier, monospace;
    --ok:#46e06a;
    --bad:#ff3b2f;
  }
  html,body{height:100%}
  [hidden]{display:none!important}
  body{
    background:
      radial-gradient(120% 80% at 50% 0%, #1f2621 0%, var(--room) 70%);
    color:var(--engrave);
    font-family:var(--type);
    padding-inline:16px;
    padding-top:calc(24px + env(safe-area-inset-top, 0px));
    padding-bottom:calc(24px + env(safe-area-inset-bottom, 0px));
    box-sizing:border-box;
    display:flex;
    justify-content:center;
    align-items:flex-start;
  }
  *{box-sizing:border-box}

  .panel{
    position:relative;
    width:100%;
    max-width:760px;
    border-radius:14px;
    padding:clamp(20px,4vw,40px) clamp(16px,4vw,44px) clamp(20px,3vw,32px);
    background:
      radial-gradient(circle at 20% 15%, rgba(255,255,255,.05), transparent 45%),
      repeating-linear-gradient(92deg, rgba(0,0,0,.035) 0 2px, transparent 2px 5px),
      linear-gradient(180deg, var(--enamel-hi), var(--enamel) 40%, var(--enamel-lo));
    box-shadow:
      inset 0 2px 0 rgba(255,255,255,.08),
      inset 0 -3px 0 rgba(0,0,0,.4),
      0 0 0 3px #11150f,
      0 0 0 5px var(--brass-lo),
      0 30px 60px rgba(0,0,0,.6);
    display:flex;
    flex-direction:column;
    gap:clamp(18px,3vw,28px);
  }
  .screw{
    position:absolute; width:14px; height:14px; border-radius:50%;
    background:
      linear-gradient(45deg, transparent 44%, rgba(0,0,0,.55) 44% 56%, transparent 56%),
      radial-gradient(circle at 35% 35%, var(--brass-hi), var(--brass) 45%, var(--brass-lo));
    box-shadow:0 1px 1px rgba(0,0,0,.6);
  }
  .screw.tl{top:10px;left:10px}.screw.tr{top:10px;right:10px;transform:rotate(70deg)}
  .screw.bl{bottom:10px;left:10px;transform:rotate(20deg)}.screw.br{bottom:10px;right:10px;transform:rotate(-35deg)}

  /* header */
  .head{
    display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap;
    border-bottom:1px solid rgba(0,0,0,.35);
    box-shadow:0 1px 0 rgba(255,255,255,.06);
    padding-bottom:14px;
  }
  .maker{display:flex;flex-direction:column;gap:2px}
  .maker small{font-size:11px;letter-spacing:.22em;text-transform:uppercase;opacity:.7}
  .maker h1{
    margin:0; font-family:var(--stencil); font-weight:800;
    font-size:clamp(30px,6vw,46px); line-height:.9; letter-spacing:.04em;
    color:var(--brass-hi);
    text-shadow:0 1px 0 rgba(0,0,0,.6), 0 -1px 0 rgba(255,255,255,.08);
    text-wrap:balance;
  }
  .counter{display:flex; align-items:center; gap:10px}
  .counter span{font-size:11px;letter-spacing:.22em;text-transform:uppercase}
  .drums{
    display:flex; gap:3px; padding:4px;
    background:#0c0f0c; border-radius:4px;
    box-shadow:inset 0 2px 4px #000, 0 0 0 2px var(--brass-lo), 0 0 0 3px var(--brass);
  }
  .drum{
    width:26px; height:38px; display:grid; place-items:center;
    font-family:var(--stencil); font-weight:800; font-size:28px; color:var(--plate);
    background:linear-gradient(180deg,#000 0%, #2b2b27 22%, #3a3a35 50%, #2b2b27 78%, #000 100%);
    border-radius:2px;
    font-variant-numeric:tabular-nums;
  }

  /* stage */
  .stage{min-height:260px; display:flex; flex-direction:column; gap:22px}
  .level-name{
    align-self:flex-start;
    font-family:var(--type); color:var(--plate-ink);
    background:linear-gradient(180deg,#efe6cf,var(--plate));
    padding:6px 14px; font-size:14px; letter-spacing:.12em; text-transform:uppercase;
    border-radius:2px;
    box-shadow:0 1px 0 rgba(255,255,255,.2) inset, 0 2px 3px rgba(0,0,0,.5);
  }

  .bank{
    display:grid;
    grid-template-columns: 1fr auto;
    align-items:center;
    gap:clamp(14px,4vw,40px);
    padding:clamp(16px,3vw,28px);
    border-radius:10px;
    background:linear-gradient(180deg, rgba(0,0,0,.28), rgba(0,0,0,.14));
    box-shadow:inset 0 3px 8px rgba(0,0,0,.55), 0 1px 0 rgba(255,255,255,.06);
  }
  .lamps{display:grid; grid-template-columns:repeat(4,1fr); gap:clamp(8px,2.5vw,24px)}
  .lamp-cell{display:flex; flex-direction:column; align-items:center; gap:10px}
  .lamp-cell .tag{
    font-size:11px; letter-spacing:.18em; text-transform:uppercase; opacity:.75;
  }
  .lamp{
    --c:#2a2c27;
    --size:clamp(56px,13vw,96px);
    width:var(--size); height:var(--size);
    border-radius:50%; border:0; padding:0; cursor:pointer;
    background:
      radial-gradient(circle at 50% 50%, transparent 58%, rgba(0,0,0,.4) 60%, transparent 62%),
      conic-gradient(from 200deg, var(--brass-lo), var(--brass-hi), var(--brass), var(--brass-lo), var(--brass-hi), var(--brass-lo));
    box-shadow:0 4px 0 #0b0d0a, 0 8px 14px rgba(0,0,0,.55);
    display:grid; place-items:center;
    transition:transform .06s ease, box-shadow .06s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .lamp:active, .lamp.pressed{transform:translateY(3px); box-shadow:0 1px 0 #0b0d0a, 0 4px 8px rgba(0,0,0,.55)}
  .lamp:focus-visible{outline:3px solid var(--brass-hi); outline-offset:5px}
  .glass{
    width:74%; height:74%; border-radius:50%;
    background:
      radial-gradient(circle at 34% 28%, rgba(255,255,255,.55) 0 7%, transparent 16%),
      radial-gradient(circle at 50% 55%, color-mix(in srgb, var(--c) 92%, white) 0%, var(--c) 45%, color-mix(in srgb, var(--c) 45%, black) 100%);
    box-shadow:inset 0 -4px 8px rgba(0,0,0,.45), inset 0 2px 3px rgba(255,255,255,.2);
    transition:box-shadow .15s ease, background .15s ease;
  }
  .lamp.on .glass{
    box-shadow:
      inset 0 -4px 8px rgba(0,0,0,.25),
      inset 0 2px 3px rgba(255,255,255,.3),
      0 0 18px 2px color-mix(in srgb, var(--c) 70%, transparent),
      0 0 44px 8px color-mix(in srgb, var(--c) 35%, transparent);
  }
  .lamp.off .glass{
    background:
      radial-gradient(circle at 34% 28%, rgba(255,255,255,.18) 0 7%, transparent 16%),
      radial-gradient(circle at 50% 55%, #3a3c36 0%, #22241f 60%, #111210 100%);
  }
  .lamp.on[data-color="negro"] .glass{
    background:
      radial-gradient(circle at 34% 28%, rgba(255,255,255,.5) 0 7%, transparent 16%),
      radial-gradient(circle at 50% 55%, #2e2e34 0%, #0c0c0f 55%, #000 100%);
    box-shadow:inset 0 -4px 8px rgba(0,0,0,.6), 0 0 0 2px rgba(255,255,255,.45), 0 0 16px 3px rgba(255,255,255,.28);
  }
  .lamp-cell .name{
    min-width:9ch; text-align:center;
    font-size:13px; color:var(--plate-ink);
    background:var(--plate); padding:2px 6px; border-radius:2px;
    box-shadow:0 1px 2px rgba(0,0,0,.5);
    text-transform:uppercase; letter-spacing:.08em;
  }
  .flash .glass{animation:flash .5s ease-in-out 3}
  @keyframes flash{50%{filter:brightness(1.8)}}

  /* lever */
  .lever{
    display:flex; flex-direction:column; align-items:center; gap:8px;
    user-select:none; -webkit-user-select:none;
  }
  .lever .tag{font-size:11px; letter-spacing:.18em; text-transform:uppercase; opacity:.75}
  .slot-plate{
    position:relative; width:64px; height:clamp(150px,30vw,190px);
    border-radius:32px;
    background:
      radial-gradient(circle at 30% 20%, rgba(255,255,255,.35), transparent 40%),
      linear-gradient(90deg, var(--brass-lo), var(--brass-hi) 30%, var(--brass) 60%, var(--brass-lo));
    box-shadow:0 4px 0 #0b0d0a, 0 8px 14px rgba(0,0,0,.55);
    touch-action:none;
  }
  .slot{
    position:absolute; left:50%; top:22px; bottom:22px; width:12px; transform:translateX(-50%);
    border-radius:6px; background:#0a0b09; box-shadow:inset 0 2px 4px #000;
  }
  .handle{
    --y:0px;
    position:absolute; left:50%; top:10px;
    width:54px; height:54px; margin-left:-27px;
    transform:translateY(var(--y));
    border:0; padding:0; border-radius:50%; cursor:grab;
    background:radial-gradient(circle at 35% 30%, #ff8a73 0 10%, #c3261a 35%, #6d0f08 90%);
    box-shadow:0 6px 10px rgba(0,0,0,.6), inset 0 -3px 6px rgba(0,0,0,.4);
    transition:transform .35s cubic-bezier(.3,1.6,.5,1);
    touch-action:none;
  }
  .handle::before{ /* stem into the slot */
    content:""; position:absolute; left:50%; top:50%; width:10px; height:10px; margin:-5px 0 0 -5px;
    border-radius:50%; background:#222;
  }
  .handle.dragging{transition:none; cursor:grabbing}
  .handle.pulling{transition:transform .18s cubic-bezier(.6,0,.9,.5)}
  .handle:focus-visible{outline:3px solid var(--brass-hi); outline-offset:4px}
  .lever.locked .handle{cursor:not-allowed; filter:saturate(.4) brightness(.8)}
  .lever .hint{font-size:11px; opacity:.6; text-align:center; max-width:12ch; line-height:1.3}
  .lever.cooling .hint{opacity:1; color:var(--brass-hi); font-variant-numeric:tabular-nums}

  /* readout */
  .readout{
    display:grid; grid-template-columns:auto 1fr; gap:16px; align-items:center;
  }
  .pilots{display:flex; gap:14px}
  .pilot{display:flex; flex-direction:column; align-items:center; gap:6px}
  .pilot i{
    display:block; width:22px; height:22px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, rgba(255,255,255,.2) 0 12%, #2b2d28 40%, #121310);
    box-shadow:0 0 0 3px var(--brass-lo), 0 0 0 4px var(--brass), inset 0 -2px 4px rgba(0,0,0,.6);
    transition:background .1s, box-shadow .1s;
  }
  .pilot span{font-size:10px; letter-spacing:.16em; text-transform:uppercase; opacity:.75}
  .pilot.ok.lit i{
    background:radial-gradient(circle at 35% 30%, #eaffea 0 10%, var(--ok) 40%, #0f6a22);
    box-shadow:0 0 0 3px var(--brass-lo), 0 0 0 4px var(--brass), 0 0 16px 4px rgba(70,224,106,.55);
  }
  .pilot.bad.lit i{
    background:radial-gradient(circle at 35% 30%, #ffe3df 0 10%, var(--bad) 40%, #7a0e07);
    box-shadow:0 0 0 3px var(--brass-lo), 0 0 0 4px var(--brass), 0 0 16px 4px rgba(255,59,47,.55);
  }
  .tape{
    min-height:52px;
    display:flex; align-items:center;
    padding:10px 16px;
    background:
      repeating-linear-gradient(180deg, transparent 0 23px, rgba(80,60,20,.08) 23px 24px),
      linear-gradient(180deg,#f3ead3,var(--plate));
    color:var(--plate-ink);
    font-size:clamp(14px,2.4vw,16px);
    line-height:1.4;
    border-radius:2px;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.15), 0 3px 6px rgba(0,0,0,.45);
    overflow-wrap:anywhere;
  }
  .tape .cursor{display:inline-block; width:.6em; margin-left:2px; animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}

  .next{
    align-self:flex-end;
    font-family:var(--stencil); font-weight:800; font-size:20px; letter-spacing:.08em;
    color:#1b1609; cursor:pointer;
    padding:10px 22px; border:0; border-radius:4px;
    background:linear-gradient(180deg, var(--brass-hi), var(--brass) 55%, var(--brass-lo));
    box-shadow:0 4px 0 #3c2d12, 0 8px 12px rgba(0,0,0,.5);
  }
  .next:active{transform:translateY(3px); box-shadow:0 1px 0 #3c2d12, 0 3px 6px rgba(0,0,0,.5)}
  .next:focus-visible{outline:3px solid var(--plate); outline-offset:4px}

  /* módulo 2: terminal CRT */
  .crt{
    --ph:#86ffa4; --ph-dim:rgba(134,255,164,.45); --ph-faint:rgba(134,255,164,.18); --glass:#03110a;
    padding:clamp(12px,2.6vw,22px);
    border-radius:18px;
    background:linear-gradient(180deg,#2a2723,#171512 60%,#0f0e0c);
    box-shadow:inset 0 2px 0 rgba(255,255,255,.08), inset 0 -2px 0 rgba(0,0,0,.6), 0 6px 14px rgba(0,0,0,.55), 0 0 0 2px var(--brass-lo);
    display:flex; flex-direction:column; gap:10px;
  }
  .crt-label{display:flex; justify-content:space-between; font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--engrave); opacity:.8; padding-inline:4px}
  .screen{
    position:relative; overflow:hidden;
    border-radius:22px / 18px;
    background:radial-gradient(120% 100% at 50% 45%, #0a2515 0%, var(--glass) 70%, #000 100%);
    box-shadow:inset 0 0 40px rgba(0,0,0,.9), inset 0 0 0 2px #000;
    padding:clamp(14px,3vw,24px);
    font-family:"VT323", "Courier New", monospace;
    color:var(--ph);
    text-shadow:0 0 6px rgba(134,255,164,.55);
    font-size:clamp(17px,2.9vw,21px);
    line-height:1.15;
    display:flex; flex-direction:column; gap:14px;
    cursor:text;
  }
  .screen::after{
    content:""; position:absolute; inset:0; pointer-events:none;
    background:
      repeating-linear-gradient(180deg, rgba(0,0,0,.28) 0 1px, transparent 1px 3px),
      radial-gradient(120% 90% at 50% 50%, transparent 60%, rgba(0,0,0,.55) 100%);
    animation:flicker 4s infinite steps(1);
  }
  @keyframes flicker{0%,100%{opacity:1}47%{opacity:.92}48%{opacity:1}83%{opacity:.95}}
  .code-title{display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; color:var(--ph)}
  .code-title span:last-child{opacity:.6}
  .code-wrap{overflow-x:auto}
  table.code{
    border-collapse:collapse; width:100%; min-width:300px; table-layout:fixed;
    text-align:center; font-variant-numeric:tabular-nums;
  }
  table.code td{border:1px solid var(--ph-faint); padding:2px 0; height:1.45em}
  table.code tr:first-child td, table.code td:first-child{color:var(--ph); opacity:.75}
  table.code tr:first-child td{border-bottom:2px solid var(--ph)}
  table.code td:first-child{border-right:2px solid var(--ph)}
  table.code tr:first-child td:first-child{border-right:1px solid var(--ph-faint)}
  table.code tr:nth-child(2) td:first-child{border-top:1px solid var(--ph-faint)}
  .rule{border:0; border-top:1px dashed var(--ph-faint); margin:0}
  .term{height:clamp(170px,30vw,220px); overflow-y:auto; scrollbar-width:thin; scrollbar-color:var(--ph-faint) transparent}
  .term p{margin:0; white-space:pre-wrap; overflow-wrap:anywhere}
  .term .err{color:#ffb86b; text-shadow:0 0 6px rgba(255,160,80,.6)}
  .term .dim{opacity:.6}
  .term .echo{opacity:.85}
  .prompt{display:flex; gap:.5ch; align-items:baseline; flex-wrap:wrap}
  .prompt input{
    flex:1; min-width:8ch;
    background:transparent; border:0; outline:0; padding:0;
    font:inherit; color:inherit; text-shadow:inherit; text-transform:uppercase; caret-color:var(--ph);
    letter-spacing:.05em;
  }
  .prompt input:disabled{opacity:.5}
  .screen:focus-within{box-shadow:inset 0 0 40px rgba(0,0,0,.9), inset 0 0 0 2px #000, 0 0 0 2px rgba(134,255,164,.25)}
  .progress{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
  .progress b{font-weight:400; display:inline-block; min-width:4.5ch; text-align:center; border:1px solid var(--ph-dim); padding:0 4px}
  .progress b.done{background:var(--ph); color:var(--glass); text-shadow:none}
  .progress b.filled{background:var(--ph-faint)}
  .crt-foot{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap}

  /* módulo 3: diagnóstico de bichos */
  .alarm-tag.on{color:#ffb86b; animation:blink 1.2s steps(1) infinite}
  .alerta p, .t3 p{margin:0; white-space:pre-wrap; overflow-wrap:anywhere}
  .alerta .err, .t3 .err{color:#ffb86b; text-shadow:0 0 6px rgba(255,160,80,.6)}
  .alerta .dim, .t3 .dim, .datos .dim, .sens .dim{opacity:.6}
  .t3{height:clamp(120px,22vw,170px)}
  .falla{display:grid; grid-template-columns:auto 1fr; gap:clamp(14px,3vw,26px); align-items:center}
  .mapa{display:grid; grid-template-columns:repeat(5, clamp(30px,6.4vw,44px)); grid-auto-rows:clamp(30px,6.4vw,44px); gap:2px}
  .mapa .rl{border:1px solid var(--ph-dim); display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1}
  .mapa .rl small{font-size:.62em; opacity:.6}
  .mapa .rl b{font-weight:400; letter-spacing:.1em}
  .mapa .rj{display:grid; place-items:center; color:#ffe27a; text-shadow:0 0 6px rgba(255,220,110,.6)}
  .datos p{margin:0}
  .datos .sub{padding-left:2ch; margin-bottom:6px; opacity:.85}
  .sens{margin-top:10px}
  .sens p{margin:0}
  .sens span{color:#ffe27a; text-shadow:0 0 6px rgba(255,220,110,.6)}

  .prog3{
    display:flex; flex-direction:column; gap:12px;
    padding:clamp(14px,3vw,24px); border-radius:10px;
    background:linear-gradient(180deg, rgba(0,0,0,.28), rgba(0,0,0,.14));
    box-shadow:inset 0 3px 8px rgba(0,0,0,.55), 0 1px 0 rgba(255,255,255,.06);
  }
  .prog3-head{display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; font-size:11px; letter-spacing:.18em; text-transform:uppercase}
  .prog3-head span:last-child{opacity:.6; letter-spacing:.08em; text-transform:none; font-size:12px}
  .prog3-body{display:grid; grid-template-columns:1fr auto; gap:clamp(14px,4vw,40px); align-items:center}
  .knobs{display:grid; grid-template-columns:repeat(3,1fr); gap:clamp(10px,2.4vw,20px) clamp(8px,2vw,18px)}
  .knob-cell{display:flex; flex-direction:column; align-items:center; gap:7px}
  .knob-cell .tag{font-size:11px; letter-spacing:.14em; text-transform:uppercase; opacity:.75}
  .dial{
    display:grid; place-items:center; padding:6px; border-radius:50%;
    background:conic-gradient(from 200deg, var(--brass-lo), var(--brass-hi), var(--brass), var(--brass-lo), var(--brass-hi), var(--brass-lo));
    box-shadow:0 3px 0 #0b0d0a, 0 6px 10px rgba(0,0,0,.5);
  }
  .knob{
    --a:-135deg;
    position:relative; width:clamp(50px,10.5vw,68px); aspect-ratio:1; border-radius:50%; border:0; padding:0; cursor:pointer;
    background:
      repeating-conic-gradient(from 0deg, rgba(255,255,255,.05) 0 6deg, transparent 6deg 12deg),
      radial-gradient(circle at 38% 32%, #57504a 0%, #25211d 55%, #0d0b0a 100%);
    box-shadow:inset 0 -3px 5px rgba(0,0,0,.6), inset 0 2px 2px rgba(255,255,255,.12);
    transform:rotate(var(--a)); transition:transform .18s cubic-bezier(.3,1.4,.5,1);
    -webkit-tap-highlight-color:transparent;
  }
  .knob::after{content:""; position:absolute; left:50%; top:7%; width:5px; height:34%; margin-left:-2.5px; border-radius:3px; background:var(--plate); box-shadow:0 0 4px rgba(255,255,255,.3)}
  .knob:focus-visible{outline:3px solid var(--brass-hi); outline-offset:8px}
  .kplate{
    display:flex; align-items:baseline; justify-content:center; gap:6px;
    min-width:9.5ch; padding:2px 6px; border-radius:2px;
    background:var(--plate); color:var(--plate-ink); box-shadow:0 1px 2px rgba(0,0,0,.5);
  }
  .kplate b{font-family:"Segoe UI Symbol","DejaVu Sans",system-ui,sans-serif; font-size:17px; line-height:1}
  .kplate small{font-size:11px; letter-spacing:.06em; text-transform:uppercase}
  .knob-cell:not(.set) .kplate{opacity:.55}

  @media (max-width:520px){
    .falla{grid-template-columns:1fr; justify-items:start}
    .prog3-body{grid-template-columns:1fr; justify-items:center}
    .knobs{width:100%}
    .kplate{min-width:0; width:100%; gap:3px; padding:2px 2px}
    .kplate small{font-size:9px; letter-spacing:0}
  }

  /* nivel 4: lista de vibraciones y cierre */
  .vib-panel{display:flex; flex-direction:column; gap:10px}
  .vib{list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(auto-fill,minmax(13ch,1fr)); gap:2px 16px; font-variant-numeric:tabular-nums}
  .vib li{white-space:pre}
  .vib span{opacity:.5}
  .radio{align-self:flex-start; border:1px solid var(--ph); padding:2px 10px; letter-spacing:.05em}
  .fin{
    display:flex; flex-direction:column; align-items:center; gap:12px; text-align:center;
    padding:30px 20px; border-radius:10px;
    background:radial-gradient(120% 120% at 50% 0%, rgba(236,208,142,.10), rgba(0,0,0,.25) 70%);
    box-shadow:inset 0 3px 8px rgba(0,0,0,.55), 0 0 0 2px var(--brass-lo);
  }
  .fin-k{font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--engrave); opacity:.85}
  .fin strong{font-family:var(--stencil); font-weight:800; font-size:clamp(30px,6vw,46px); line-height:1; color:var(--brass-hi); letter-spacing:.06em}
  .fin-coord{margin:0; font-family:"VT323","Courier New",monospace; font-size:clamp(22px,4vw,30px); color:#86ffa4; text-shadow:0 0 8px rgba(134,255,164,.55)}
  .fin p{margin:0; max-width:46ch; line-height:1.5}

  /* placeholder level */
  .wip{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
    min-height:220px; border-radius:10px; text-align:center; padding:24px;
    background:repeating-linear-gradient(-45deg, rgba(0,0,0,.25) 0 18px, rgba(230,190,60,.10) 18px 36px);
    box-shadow:inset 0 3px 8px rgba(0,0,0,.55);
  }
  .wip strong{font-family:var(--stencil); font-weight:800; font-size:clamp(26px,5vw,38px); color:var(--brass-hi); letter-spacing:.06em}
  .wip p{margin:0; max-width:40ch; line-height:1.5}

  /* foot */
  .foot{
    display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;
    border-top:1px solid rgba(0,0,0,.35); box-shadow:0 -1px 0 rgba(255,255,255,.06) inset;
    padding-top:14px; font-size:11px; letter-spacing:.14em; text-transform:uppercase;
  }
  .switches{display:flex; gap:10px; flex-wrap:wrap}
  .sw{
    font:inherit; letter-spacing:inherit; text-transform:inherit;
    color:var(--engrave); background:rgba(0,0,0,.25);

<script>
(function(){
  /* forma de cargar el programa del nivel 3: "perillas" o "terminal" */
  const INPUT_MODE = "terminal";

  /* ---------- sonido ---------- */
  let actx = null, soundOn = true;
  function ctx(){
    if(!soundOn) return null;
    try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; }
    if(actx.state === "suspended") actx.resume();
    return actx;
  }
  function noise(a, dur, freq, gain){
    const len = Math.floor(a.sampleRate*dur), buf = a.createBuffer(1,len,a.sampleRate), d = buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i] = (Math.random()*2-1) * Math.pow(1-i/len, 3);
    const src = a.createBufferSource(); src.buffer = buf;
    const f = a.createBiquadFilter(); f.type="bandpass"; f.frequency.value=freq; f.Q.value=1.2;
    const g = a.createGain(); g.gain.value = gain;
    src.connect(f).connect(g).connect(a.destination); src.start();
  }
  function tone(a, type, f0, t0, dur, gain, f1){
    const o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, a.currentTime+t0);
    if(f1) o.frequency.exponentialRampToValueAtTime(f1, a.currentTime+t0+dur);
    g.gain.setValueAtTime(0.0001, a.currentTime+t0);
    g.gain.exponentialRampToValueAtTime(gain, a.currentTime+t0+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime+t0+dur);
    o.connect(g).connect(a.destination); o.start(a.currentTime+t0); o.stop(a.currentTime+t0+dur+0.05);
  }
  const sfx = {
    click(){ const a=ctx(); if(!a) return; noise(a,.035,2400,.5); tone(a,"square",1800,0,.02,.04); },
    lever(){ const a=ctx(); if(!a) return; noise(a,.12,500,.9); tone(a,"sine",120,0,.18,.35,60); },
    ok(){ const a=ctx(); if(!a) return; [523,659,784,1047].forEach((f,i)=>tone(a,"triangle",f,.12*i,.35,.18)); },
    bad(){ const a=ctx(); if(!a) return; tone(a,"sawtooth",110,0,.55,.16,95); tone(a,"square",55,0,.55,.08); },
    alarm(){ const a=ctx(); if(!a) return; tone(a,"square",880,0,.14,.07); tone(a,"square",660,.16,.14,.07); }
  };

  /* ---------- estado y persistencia ---------- */
  const KEY = "consola-rele70-v2";
  function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; } }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
  let state = {};

  /* ---------- colores ---------- */
  const COLORS = [
    {id:"marrón",   hex:"#9a5a24"},
    {id:"negro",    hex:"#16161a"},
    {id:"fucsia",   hex:"#ff2bd0"},
    {id:"amarillo", hex:"#ffd60a"},
    {id:"azul",     hex:"#2c63ff"},
    {id:"violeta",  hex:"#8a3dff"},
    {id:"naranja",  hex:"#ff8c1a"},
    {id:"verde",    hex:"#2fd65a"}
  ];

  /* Las 8 mariposas: cada combinación de lámparas (nivel 1) lleva a un bloque de
     4 sentencias (nivel 2) y a un panel con una única solución (nivel 3).
     El índice es el mismo en las tres tablas. */
  const COMBOS = [["violeta","azul","amarillo","fucsia"],["fucsia","amarillo","azul","violeta"],["naranja","marrón","verde","negro"],["negro","verde","marrón","naranja"],["verde","negro","naranja","marrón"],["marrón","naranja","negro","verde"],["azul","violeta","fucsia","amarillo"],["amarillo","fucsia","violeta","azul"]];
  const BLOCKS = [["SET","ADD","MOVE","TEST"],["TEST","MOVE","ADD","SET"],["COMPARE","INPUT","JUMP","OUTPUT"],["OUTPUT","JUMP","INPUT","COMPARE"],["JUMP","OUTPUT","COMPARE","INPUT"],["INPUT","COMPARE","OUTPUT","JUMP"],["ADD","SET","TEST","MOVE"],["MOVE","TEST","SET","ADD"]];
  const PUZZLES = [
    /* mariposa 1 */ {
      ini:{M:0, G:1, V:2},
      rej:{M:3, G:4, V:6},
      sens:[ {num:57, r:{M:"U", G:"R", V:"L"}},     // alfa
             {num:28, r:{M:"U", G:"U", V:"R"}} ]    // beta
    },
    /* mariposa 2 */ {
      ini:{M:4, G:7, V:5},
      rej:{M:8, G:7, V:9},
      sens:[ {num:14, r:{M:"D", G:"U", V:"D"}},     // alfa
             {num:46, r:{M:"L", G:"D", V:"R"}} ]    // beta
    },
    /* mariposa 3 */ {
      ini:{M:2, G:1, V:4},
      rej:{M:10, G:4, V:3},
      sens:[ {num:38, r:{M:"L", G:"R", V:"U"}},     // alfa
             {num:7, r:{M:"D", G:"U", V:"U"}} ]    // beta
    },
    /* mariposa 4 */ {
      ini:{M:4, G:2, V:1},
      rej:{M:5, G:7, V:8},
      sens:[ {num:60, r:{M:"R", G:"D", V:"L"}},     // alfa
             {num:12, r:{M:"L", G:"D", V:"D"}} ]    // beta
    },
    /* mariposa 5 */ {
      ini:{M:3, G:6, V:4},
      rej:{M:2, G:0, V:1},
      sens:[ {num:3, r:{M:"U", G:"L", V:"L"}},     // alfa
             {num:34, r:{M:"U", G:"U", V:"L"}} ]    // beta
    },
    /* mariposa 6 */ {
      ini:{M:4, G:1, V:2},
      rej:{M:7, G:5, V:8},
      sens:[ {num:24, r:{M:"D", G:"L", V:"D"}},     // alfa
             {num:9, r:{M:"D", G:"L", V:"L"}} ]    // beta
    },
    /* mariposa 7 */ {
      ini:{M:0, G:4, V:1},
      rej:{M:4, G:2, V:0},
      sens:[ {num:25, r:{M:"R", G:"R", V:"U"}},     // alfa
             {num:49, r:{M:"R", G:"U", V:"D"}} ]    // beta
    },
    /* mariposa 8 */ {
      ini:{M:8, G:7, V:4},
      rej:{M:5, G:1, V:0},
      sens:[ {num:22, r:{M:"U", G:"L", V:"U"}},     // alfa
             {num:10, r:{M:"L", G:"U", V:"U"}} ]    // beta
    }
  ];

  /* ---------- nivel 4: origen de la vibración (índice = state.m) ----------
     Receptor en (0,0), antena al norte. 1 unidad del mapa = 1000 km. Mapa: x −20..20, y −10..10.
     Reglas de la fase 1 (las aplican los jugadores):
       R1  se descarta todo punto con |x| > 9
       R2  espejo: si están (x,y) y (−x,−y), se descarta el de y < 0
       R3  eco: si un punto es 2 o 3 veces otro, se descarta el mayor (4 veces o más: se conserva)
     Mariposas 1 y 2 verificadas: el resultado no depende del orden de las reglas y las
     3 circunferencias se cortan en un único punto. */
  const NIVEL4 = [
    { // mariposa 1
      lista:     [[12,3],[0,2],[-14,6],[9,-5],[0,6],[-13,2],[-9,5],[15,-4],[0,8],[-11,-7],[13,-2]],
      sobreviven:[[0,2],[0,8],[-9,5]],
      radio: 5,
      origen: [-4,5],
      lugar: "Atlántico Norte"
    },
    { // mariposa 2
      lista:     [[-6,2],[9,-1],[-9,1],[14,4],[-6,-8],[10,3],[-12,5],[-3,1],[12,-5],[-13,-9],[11,8]],
      sobreviven:[[-9,1],[-6,-8],[-3,1]],
      radio: 5,
      origen: [-6,-3],
      lugar: "Misiones, Argentina"
    }
    // mariposas 3 a 8: pendientes (mientras tanto se muestra "en construcción")
  ];
  /* Clave del facilitador antes de revelar el radio. Vacía = no se pide. Ejemplo: "ORION" */
  const CLAVE_L4 = "";
  /* Texto de la pantalla de cierre */
  const FIN_TEXTO = "La señal venía de ahí. El receptor vuelve a la calma y la consola Relé 70 queda en silencio.";

  /* ---------- piezas compartidas ---------- */
  const $ = (tag, cls, html) => { const e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; };
  let tapeTimer = null;
  function type(tape, text){
    clearInterval(tapeTimer);
    tape.textContent = "";
    const cur = $("span","cursor","▌");
    let i = 0;
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if(reduce){ tape.textContent = text; tape.appendChild(cur); return; }
    tapeTimer = setInterval(()=>{
      tape.textContent = text.slice(0, ++i);
      tape.appendChild(cur);
      if(i >= text.length) clearInterval(tapeTimer);
    }, 22);
  }
  function setDrums(n){
    const s = String(n).padStart(2,"0");
    document.getElementById("drums").innerHTML = s.split("").map(d=>`<b class="drum">${d}</b>`).join("");
  }
  function makeLever(onPull){
    const wrap = $("div","lever");
    wrap.innerHTML = `<span class="tag">Enter</span>
      <div class="slot-plate"><div class="slot"></div>
        <button class="handle" type="button" aria-label="Bajar la palanca para comprobar"></button>
      </div>
      <span class="hint">Bajá la palanca para comprobar</span>`;
    const plate = wrap.querySelector(".slot-plate"), h = wrap.querySelector(".handle");
    let busy = false, dragging = false, startY = 0, moved = 0;
    const travel = () => plate.clientHeight - h.offsetHeight - 20;
    function pull(){
      if(busy || wrap.classList.contains("locked")) return;
      busy = true;
      h.classList.remove("dragging"); h.classList.add("pulling");
      h.style.setProperty("--y", travel()+"px");
      setTimeout(()=>{
        sfx.lever();
        onPull();
        setTimeout(()=>{ h.classList.remove("pulling"); h.style.setProperty("--y","0px"); busy=false; }, 260);
      }, 180);
    }
    h.addEventListener("pointerdown", e=>{
      if(busy || wrap.classList.contains("locked")) return;
      dragging = true; moved = 0; startY = e.clientY;
      h.setPointerCapture(e.pointerId); h.classList.add("dragging");
    });
    h.addEventListener("pointermove", e=>{
      if(!dragging) return;
      moved = Math.max(0, Math.min(travel(), e.clientY - startY));
      h.style.setProperty("--y", moved+"px");
    });
    const end = ()=>{
      if(!dragging) return; dragging = false;
      h.classList.remove("dragging");
      if(moved < 6 || moved > travel()*0.6) pull();       // un toque o un tirón largo cuentan
      else h.style.setProperty("--y","0px");              // tirón corto: vuelve
    };
    h.addEventListener("pointerup", end);
    h.addEventListener("pointercancel", end);
    h.addEventListener("keydown", e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); pull(); } });
    wrap.lock = on => wrap.classList.toggle("locked", on);
    wrap.pull = pull;
    return wrap;
  }
  function makeReadout(){
    const r = $("div","readout");
    r.innerHTML = `<div class="pilots">
        <div class="pilot ok"><i></i><span>Correcto</span></div>
        <div class="pilot bad"><i></i><span>Error</span></div>
      </div>
      <div class="tape" role="status" aria-live="polite"></div>`;
    r.tape = r.querySelector(".tape");
    r.ok = r.querySelector(".pilot.ok");
    r.bad = r.querySelector(".pilot.bad");
    r.light = which => {
      r.ok.classList.toggle("lit", which==="ok");
      r.bad.classList.toggle("lit", which==="bad");
    };
    return r;
  }

  /* ---------- niveles ---------- */
  const LEVELS = [
    {
      name: "Nivel 1 · Secuencia de encendido",
      mount(stage, api){
                const lv = state.l1 = state.l1 || { lamps:[-1,-1,-1,-1], solved:false };

        const bank = $("div","bank");
        const lamps = $("div","lamps");
        const cells = lv.lamps.map((ci, k)=>{
          const cell = $("div","lamp-cell");
          cell.innerHTML = `<span class="tag">L${k+1}</span>
            <button class="lamp" type="button"><span class="glass"></span></button>
            <span class="name"></span>`;
          const b = cell.querySelector(".lamp");
          b.addEventListener("click", ()=>{
            if(lv.solved) return;
            lv.lamps[k] = (lv.lamps[k] + 1) % COLORS.length;
            sfx.click(); paint(k); save();
            readout.light(null);
          });
          lamps.appendChild(cell);
          return cell;
        });
        function paint(k){
          const cell = cells[k], b = cell.querySelector(".lamp"), ci = lv.lamps[k];
          const on = ci >= 0;
          b.classList.toggle("on", on); b.classList.toggle("off", !on);
          b.style.setProperty("--c", on ? COLORS[ci].hex : "#2a2c27");
          b.dataset.color = on ? COLORS[ci].id : "";
          cell.querySelector(".name").textContent = on ? COLORS[ci].id : "apagada";
          b.setAttribute("aria-label", `Lámpara ${k+1}: ${on ? COLORS[ci].id : "apagada"}. Tocá para cambiar de color.`);
        }
        cells.forEach((_,k)=>paint(k));

        const readout = makeReadout();
        const lever = makeLever(check);
        bank.append(lamps, lever);
        stage.append(bank, readout);

        let nextBtn = null;
        function showNext(){
          if(nextBtn) return;
          nextBtn = $("button","next","Siguiente nivel →");
          nextBtn.type = "button";
          nextBtn.addEventListener("click", ()=>{ sfx.click(); api.advance(); });
          stage.appendChild(nextBtn);
        }

        const WAIT_MS = 10000;
        const hint = lever.querySelector(".hint");
        const HINT_TXT = hint.textContent;
        let cdTimer = null;
        function cooldown(){
          clearInterval(cdTimer);
          const tick = ()=>{
            if(!lever.isConnected){ clearInterval(cdTimer); return; }
            const left = Math.ceil(((lv.waitUntil||0) - Date.now()) / 1000);
            if(left > 0){
              lever.lock(true); lever.classList.add("cooling");
              hint.textContent = `Recargando relés · ${left} s`;
              return;
            }
            clearInterval(cdTimer);
            lv.waitUntil = 0; save();
            lever.classList.remove("cooling");
            hint.textContent = HINT_TXT;
            if(!lv.solved){
              lever.lock(false);
              type(readout.tape, "PANEL EN ESPERA · Relés listos. Podés volver a intentar.");
            }
          };
          tick();
          cdTimer = setInterval(tick, 250);
        }

        function check(){
          const names = lv.lamps.map(ci => ci>=0 ? COLORS[ci].id : null);
          if(names.includes(null)){
            readout.light("bad"); sfx.bad();
            bank.classList.remove("shake"); void bank.offsetWidth; bank.classList.add("shake");
            type(readout.tape, "ERROR · Hay lámparas apagadas. Encendé las cuatro antes de bajar la palanca.");
            return;
          }
          const mi = COMBOS.findIndex(cb => cb.every((n,i)=>n===names[i]));
          const ok = mi >= 0;
          if(ok){
            lv.solved = true; state.m = mi; save();
            readout.light("ok"); sfx.ok();
            lamps.querySelectorAll(".lamp").forEach((b,i)=>setTimeout(()=>b.parentElement.classList.add("flash"), i*120));
            lever.lock(true);
            type(readout.tape, "MÁQUINA ENCENDIDA · Relés energizados. Módulo 2 listo para cargar.");
            showNext();
          }else{
            readout.light("bad"); sfx.bad();
            bank.classList.remove("shake"); void bank.offsetWidth; bank.classList.add("shake");
            type(readout.tape, "ERROR · Secuencia rechazada. Los relés tardan 10 segundos en recargarse.");
            lv.waitUntil = Date.now() + WAIT_MS; save();
            cooldown();
          }
        }

        if(lv.solved){
          readout.light("ok"); lever.lock(true);
          type(readout.tape, "MÁQUINA ENCENDIDA · Relés energizados. Módulo 2 listo para cargar.");
          showNext();
        }else if((lv.waitUntil||0) > Date.now()){
          type(readout.tape, "ERROR · Secuencia rechazada. Los relés tardan 10 segundos en recargarse.");
          cooldown();
        }else{
          type(readout.tape, "PANEL EN ESPERA · Ajustá las cuatro lámparas y bajá la palanca.");
        }
      }
    },
    {
      name: "Nivel 2 · Módulo de sentencias",
      mount(stage, api){
        const SENTENCES = BLOCKS[state.m|0];
        const BOOT = [
          ["MODULO 2 . UNIDAD DE CONTROL","dim"],
          ["PRUEBA DE MEMORIA ....... 4096 PALABRAS OK","dim"],
          ["LECTORA DE TARJETAS ..... LISTA","dim"],
          ["PROGRAMA DE ACCESO: SE REQUIEREN 4 SENTENCIAS",""]
        ];
        const lv = state.l2 = state.l2 || { entries:[], log:[], booted:false, solved:false };
        if(!Array.isArray(lv.entries)) lv.entries = [];   // partidas guardadas con la versión anterior
        delete lv.step;

        // tabla de codificación (tarjeta perforada: zona × dígito)
        const HEAD = ["", "-", "1","2","3","4","5","6","7","8","9"];
        const ROWS = [
          ["-", "",  "1","2","3","4","5","6","7","8","9"],
          ["Y", "&", "A","B","C","D","E","F","G","H","I"],
          ["X", "-", "J","K","L","M","N","O","P","Q","R"],
          ["0", "0", "/","S","T","U","V","W","X","Y","Z"]
        ];
        const tableHTML = "<table class='code' aria-label='Tabla de codificación: filas de zona, columnas de dígito'>" +
          [HEAD, ...ROWS].map(r => "<tr>" + r.map(c => `<td>${c}</td>`).join("") + "</tr>").join("") + "</table>";

        const crt = $("div","crt");
        crt.innerHTML = `
          <div class="crt-label"><span>Terminal · Módulo 2</span><span>Fósforo P1</span></div>
          <div class="screen">
            <div class="code-title"><span>TABLA DE CODIFICACION</span><span>ZONA x DIGITO</span></div>
            <div class="code-wrap">${tableHTML}</div>
            <hr class="rule">
            <div class="term" aria-live="polite"></div>
            <label class="prompt" hidden>
              <span class="ps"></span>
              <input id="term-in" type="text" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" maxlength="24" aria-label="Sentencia">
            </label>
            <hr class="rule">
            <div class="progress" aria-label="Sentencias cargadas"></div>
          </div>`;
        const screen = crt.querySelector(".screen");
        const term = crt.querySelector(".term");
        const prompt = crt.querySelector(".prompt");
        const ps = crt.querySelector(".ps");
        const input = crt.querySelector("input");
        const prog = crt.querySelector(".progress");

        const foot = $("div","crt-foot");
        const pilots = $("div","pilots",
          `<div class="pilot ok"><i></i><span>Correcto</span></div>
           <div class="pilot bad"><i></i><span>Error</span></div>`);
        const light = which => {
          pilots.querySelector(".ok").classList.toggle("lit", which==="ok");
          pilots.querySelector(".bad").classList.toggle("lit", which==="bad");
        };
        foot.appendChild(pilots);
        stage.append(crt, foot);

        screen.addEventListener("click", e => { if(e.target.closest(".code-wrap")) return; if(!input.disabled) input.focus(); });

        function line(t, cls, store=true){
          const p = $("p", cls||"", null); p.textContent = t; term.appendChild(p);
          term.scrollTop = term.scrollHeight;
          if(store){ lv.log.push([t, cls||""]); if(lv.log.length>60) lv.log.shift(); save(); }
        }
        function drawProgress(){
          prog.innerHTML = "SENTENCIAS " + SENTENCES.map((_,i)=>
            lv.solved ? `<b class="done">OK</b>`
            : i < lv.entries.length ? `<b class="filled">${i+1}</b>`
            : `<b>${i+1}</b>`).join("");
        }
        function ask(){
          if(lv.solved || lv.entries.length >= SENTENCES.length){ prompt.hidden = true; return; }
          ps.textContent = `INGRESE SENTENCIA ${lv.entries.length+1} >`;
          prompt.hidden = false; input.disabled = false; input.value = "";
          setTimeout(()=>input.focus({preventScroll:true}), 30);
        }
        let nextBtn = null;
        function finish(){
          lv.solved = true; save(); drawProgress();
          prompt.hidden = true; light("ok");
          if(!nextBtn){
            nextBtn = $("button","next","Siguiente nivel →"); nextBtn.type = "button";
            nextBtn.addEventListener("click", ()=>{ sfx.click(); api.advance(); });
            foot.appendChild(nextBtn);
          }
        }

        input.addEventListener("keydown", e=>{
          if(e.key !== "Enter") return;
          e.preventDefault();
          const v = input.value.trim().toUpperCase().replace(/\s+/g," ");
          if(!v) return;
          if(input.disabled) return;
          line(`SENTENCIA ${lv.entries.length+1} > ${v}`, "echo");
          sfx.click();
          lv.entries.push(v); save(); drawProgress();
          if(lv.entries.length < SENTENCES.length){ light(null); ask(); return; }

          if(!P){ prompt.hidden = true; return; }
          ps.textContent = P;
          prompt.hidden = false; input.disabled = false; input.value = "";
          setTimeout(()=>input.focus({preventScroll:true}), 30);
        }
        function reject(msg, retry){
          sfx.bad(); light("bad");
          crt.classList.remove("shake"); void crt.offsetWidth; crt.classList.add("shake");
          line(msg, "err");
          if(retry) line(retry, "dim");
        }

        // "(x, y)", "x,y", "x y"; con paréntesis se aceptan varios puntos en la misma línea
        function parsePoints(raw){
          const t = raw.replace(/[−–—]/g,"-").replace(/\s+/g," ").trim();
          const norm = (a,b) => [(+a)||0, (+b)||0];   // evita el -0
          if(t.includes("(")){
            const re = /\(\s*([+-]?\d+)\s*[,; ]\s*([+-]?\d+)\s*\)/g;
            const pts = []; let m;
            while((m = re.exec(t))) pts.push(norm(m[1], m[2]));
            const rest = t.replace(re, "").replace(/[\s,;]/g, "");
            return (pts.length && !rest) ? pts : null;
          }
          const m = t.match(/^([+-]?\d+)\s*[,; ]\s*([+-]?\d+)$/);
          return m ? [norm(m[1], m[2])] : null;
        }

        function revealRadio(){
          lv.phase = "origen"; save();
          setTag(); showPanel(); drawProgress();
          line(`TRACE CIRCUNFERENCIAS DE RADIO ${D.radio}`, "");
          line("UBIQUE EL ORIGEN DE LA VIBRACION E INGRESELO COMO X,Y", "");
          ask();
        }
        let finBox = null;
        function finish(){
          lv.phase = "fin"; lv.solved = true; save();
          prompt.hidden = true; input.disabled = true;
          light("ok"); setTag(); showPanel(); drawProgress();
          if(!finBox){
            finBox = $("div","fin",
              `<span class="fin-k">Transmisión cerrada</span>
               <strong>Origen localizado</strong>
               <p class="fin-coord">${nice(D.origen)}${D.lugar ? " · " + D.lugar : ""}</p>
               <p>${FIN_TEXTO}</p>`);
            stage.appendChild(finBox);
          }
        }

        input.addEventListener("input", ()=>{ if(pilots.querySelector(".bad.lit")) light(null); });
        input.addEventListener("keydown", e=>{
          if(e.key !== "Enter") return;
          e.preventDefault();
          if(input.disabled) return;
          const v = input.value.trim().toUpperCase();
          if(!v) return;
          line(`${ps.textContent} ${v}`, "echo");

          /* ----- fase 1: puntos sobrevivientes ----- */
          if(lv.phase === "puntos"){
            if(v === "BORRAR"){
              lv.entries = []; save(); sfx.click(); drawProgress();
              line("   CARGA BORRADA . EMPIECE DE NUEVO", "dim"); ask(); return;
            }
            if(v === "FIN"){
              if(!lv.entries.length){ sfx.bad(); line("   NO HAY PUNTOS CARGADOS", "err"); ask(); return; }
              prompt.hidden = true; input.disabled = true;
              line("ANALIZANDO SEÑAL ...", "dim");
              setTimeout(()=>{
                if(!term.isConnected) return;
                const want = new Set(D.sobreviven.map(key));
                const got = new Set(lv.entries.map(key));
                const ok = got.size === want.size && [...want].every(k => got.has(k));
                if(ok){
                  sfx.ok(); light("ok");
                  line("SEÑAL LIMPIA . LAS LECTURAS FALSAS FUERON DESCARTADAS", "");
                  lv.entries = []; save();
                  if(CLAVE_L4){
                    lv.phase = "clave"; save(); setTag(); drawProgress();
                    line("PARA CONTINUAR SE REQUIERE LA CLAVE DEL LABORATORIO", "");
                    ask();
                  }else{
                    revealRadio();
                  }
                }else{
                  reject("   ERROR . LA SEÑAL SIGUE CONTAMINADA", "VUELVA A CARGAR LOS PUNTOS DESDE EL PRIMERO");
                  lv.entries = []; save(); drawProgress(); ask();
                }
              }, 1100);
              return;
            }
            const pts = parsePoints(v);
            if(!pts){ sfx.bad(); line("   ESCRIBA CADA PUNTO COMO X,Y . POR EJEMPLO 7,-2", "err"); ask(); return; }
            pts.forEach(p=>{
              if(lv.entries.some(e => key(e) === key(p))) line(`   ${fmt(p)} YA ESTA CARGADO`, "dim");
              else if(lv.entries.length >= 20) line("   DEMASIADOS PUNTOS . ESCRIBA FIN O BORRAR", "err");
              else lv.entries.push(p);
            });
            sfx.click(); save(); drawProgress(); light(null); ask();
            return;
          }

          /* ----- clave del facilitador (opcional) ----- */
          if(lv.phase === "clave"){
            if(v.replace(/\s+/g,"") === CLAVE_L4.toUpperCase().replace(/\s+/g,"")){
              sfx.click(); line("   CLAVE ACEPTADA", "dim"); revealRadio();
            }else{
              reject("   CLAVE INCORRECTA"); ask();
            }
            return;
          }

          /* ----- fase 2: origen ----- */
          if(lv.phase === "origen"){
            const pts = parsePoints(v);
            if(!pts || pts.length !== 1){ sfx.bad(); line("   ESCRIBA UN SOLO PUNTO COMO X,Y", "err"); ask(); return; }
            prompt.hidden = true; input.disabled = true;
            line("TRIANGULANDO ...", "dim");
            setTimeout(()=>{
              if(!term.isConnected) return;
              if(key(pts[0]) === key(D.origen)){
                sfx.ok();
                line(`ORIGEN CONFIRMADO EN ${fmt(D.origen)}`, "");
                line("FIN DE LA TRANSMISION", "");
                finish();
              }else{
                reject("   ERROR . NO HAY VIBRACION EN ESE PUNTO");
                ask();
              }
            }, 900);
          }
        });

        setTag(); drawProgress();
        lv.log.forEach(([t,c]) => line(t, c, false));
        if(lv.phase === "fin"){ finish(); return; }
        if(lv.booted){ showPanel(); ask(); return; }

        // arranque: receptor saturado (guiño a las alarmas 1201/1202 del Apollo 11)
        const BOOT = [
          ["MODULO 4 . RECEPTOR DE VIBRACIONES","dim"],
          ["RECEPTOR EN (0, 0) . ANTENA AL NORTE","dim"],
          ["1202 PROGRAM ALARM","err"],
          ["RECEPTOR SATURADO: DEMASIADAS LECTURAS","err"],
          ["1201 PROGRAM ALARM","err"],
          ["HAY LECTURAS FALSAS MEZCLADAS CON LAS REALES.",""],
          ["MARQUE LA LISTA EN EL PLANISFERIO Y LIMPIE LA SEÑAL.",""]
        ];
        input.disabled = true;
        const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        let k = 0;
        (function next(){
          if(!term.isConnected) return;
          if(k < BOOT.length){
            const [t,c] = BOOT[k++];
            line(t, c);
            if(c === "err") sfx.alarm();
            setTimeout(next, reduce ? 0 : 650);
          }else{
            lv.booted = true; save();
            showPanel();
            line("CARGUE LOS PUNTOS QUE SOBREVIVEN, UNO POR LINEA.", "");
            line("ESCRIBA FIN PARA VERIFICAR O BORRAR PARA EMPEZAR DE NUEVO.", "");
            ask();
          }
        })();
      }
    }
  ];

  /* ---------- motor ---------- */
  function render(){
    const stage = document.getElementById("stage");
    stage.innerHTML = "";
    clearInterval(tapeTimer);
    const i = Math.min(state.level || 0, LEVELS.length-1);
    const L = LEVELS[i];
    setDrums(i+1);
    stage.appendChild($("div","level-name", L.name));
    L.mount(stage, {
      advance(){ state.level = i+1; save(); render(); }
    });
  }

  /* ---------- controles del pie ---------- */
  const soundBtn = document.getElementById("sound");
  soundBtn.addEventListener("click", ()=>{
    soundOn = !soundOn; state.sound = soundOn; save();
    soundBtn.textContent = "Sonido: " + (soundOn ? "sí" : "no");
    soundBtn.setAttribute("aria-pressed", String(soundOn));
  });
  const resetBtn = document.getElementById("reset");
  let armed = null;
  resetBtn.addEventListener("click", ()=>{
    if(!armed){
      resetBtn.classList.add("armed"); resetBtn.textContent = "¿Seguro? Tocá otra vez";
      armed = setTimeout(()=>{ armed=null; resetBtn.classList.remove("armed"); resetBtn.textContent="Reiniciar"; }, 3000);
      return;
    }
    clearTimeout(armed); armed = null;
    resetBtn.classList.remove("armed"); resetBtn.textContent = "Reiniciar";
    const snd = state.sound;
    state = { level:0, sound:snd };
    save(); render();
  });

  function start(data){
    state = (data && Object.keys(data).length) ? data : load();
    soundOn = state.sound !== false;
    soundBtn.textContent = "Sonido: " + (soundOn ? "sí" : "no");
    soundBtn.setAttribute("aria-pressed", String(soundOn));
    render();
  }
  window.claude?.hot?.snapshot?.(()=>state);
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
